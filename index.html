<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공구 주문 정리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Black+Han+Sans&display=swap');
:root {
  --kakao: #FEE500; --kakao-dark: #3A1D1D;
  --bg: #1a1a2e; --surface: #16213e;
  --green: #4ade80; --red: #f87171;
  --text: #e2e8f0; --muted: #94a3b8;
  --orange: #f59e0b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nanum Gothic',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header {
  background:var(--kakao); padding:14px 20px;
  display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:100;
  box-shadow:0 4px 20px rgba(254,229,0,0.3);
}
header .logo { width:34px; height:34px; background:var(--kakao-dark); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; }
header h1 { font-family:'Black Han Sans',sans-serif; font-size:17px; color:var(--kakao-dark); flex:1; }
.stats-bar { background:var(--kakao-dark); color:var(--kakao); padding:8px 20px; display:flex; gap:20px; font-size:13px; font-weight:700; overflow-x:auto; }
.stat { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.stat span { color:white; font-weight:800; }
.main { padding:14px; max-width:800px; margin:0 auto; }
.input-section { background:var(--surface); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; margin-bottom:14px; }
.tab-row { display:flex; gap:8px; margin-bottom:12px; }
.tab-btn { flex:1; padding:9px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); background:transparent; color:var(--muted); font-family:'Nanum Gothic',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; }
.tab-btn.active { background:var(--kakao); color:var(--kakao-dark); border-color:var(--kakao); }
.chat-input { width:100%; background:var(--bg); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:12px; color:var(--text); font-family:'Nanum Gothic',sans-serif; font-size:14px; resize:vertical; min-height:100px; }
.chat-input:focus { outline:none; border-color:var(--kakao); }
.chat-input::placeholder { color:var(--muted); }
.input-hint { font-size:11px; color:var(--muted); margin-top:6px; }
.file-upload-area { border:2px dashed rgba(254,229,0,0.4); border-radius:12px; padding:20px; text-align:center; cursor:pointer; transition:all 0.2s; margin-bottom:10px; background:rgba(254,229,0,0.03); position:relative; }
.file-upload-area:hover { border-color:var(--kakao); background:rgba(254,229,0,0.08); }
.file-upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.file-upload-icon { font-size:26px; margin-bottom:6px; }
.file-upload-text { font-size:13px; color:var(--muted); line-height:1.5; }
.file-upload-text strong { color:var(--kakao); }
.parse-btn { width:100%; margin-top:10px; background:var(--kakao); color:var(--kakao-dark); border:none; border-radius:10px; padding:13px; font-family:'Black Han Sans',sans-serif; font-size:16px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.parse-btn:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(254,229,0,0.4); }
.parse-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.view-tabs { display:flex; gap:6px; margin-bottom:12px; }
.view-tab { padding:7px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:var(--muted); font-family:'Nanum Gothic',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.view-tab.active { background:var(--kakao); color:var(--kakao-dark); border-color:var(--kakao); }
.orders-section { margin-bottom:90px; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.section-title { font-family:'Black Han Sans',sans-serif; font-size:15px; color:var(--kakao); }
.clear-btn { background:rgba(248,113,113,0.15); color:var(--red); border:1px solid rgba(248,113,113,0.3); border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:'Nanum Gothic',sans-serif; font-weight:700; }
.order-row { background:var(--surface); border-left:3px solid var(--kakao); border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:6px; display:flex; align-items:center; gap:10px; animation:slideIn 0.25s ease; }
.order-row.warn { border-left-color:var(--orange); }
@keyframes slideIn { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
.row-num { font-size:11px; color:var(--muted); min-width:20px; }
.row-body { flex:1; font-size:14px; line-height:1.5; }
.row-name { font-weight:800; color:var(--text); }
.row-item { color:var(--muted); font-size:13px; }
.row-badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:700; flex-shrink:0; }
.badge-ok { background:rgba(74,222,128,0.15); color:var(--green); }
.badge-warn { background:rgba(245,158,11,0.2); color:var(--orange); }
.row-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 4px; border-radius:4px; }
.row-del:hover { color:var(--red); }
.group-card { background:var(--surface); border-radius:12px; margin-bottom:10px; overflow:hidden; }
.group-header { padding:12px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.06); }
.group-title { font-weight:800; font-size:14px; }
.group-count { font-size:12px; color:var(--kakao); font-weight:700; }
.group-rows { padding:8px 14px 12px; }
.group-row { font-size:13px; color:var(--muted); padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.group-row:last-child { border-bottom:none; }
.group-row strong { color:var(--text); }
.bottom-summary { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(135deg,var(--kakao-dark),#2d1515); border-top:2px solid var(--kakao); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; z-index:100; }
.summary-left { font-size:13px; color:var(--kakao); }
.summary-left strong { font-size:19px; font-family:'Black Han Sans',sans-serif; }
.export-btn { background:var(--kakao); color:var(--kakao-dark); border:none; border-radius:10px; padding:9px 16px; font-family:'Black Han Sans',sans-serif; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:5px; }
.loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
.loading-overlay.show { display:flex; }
.spinner { width:44px; height:44px; border:4px solid rgba(254,229,0,0.2); border-top-color:var(--kakao); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
.loading-text { color:var(--kakao); font-family:'Black Han Sans',sans-serif; font-size:17px; }
.step-dot { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.1); color:var(--muted); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
.step-dot.active { background:var(--kakao); color:var(--kakao-dark); transform:scale(1.15); }
.step-dot.done { background:var(--green); color:#052e16; }
.toast { position:fixed; top:76px; left:50%; transform:translateX(-50%) translateY(-20px); background:var(--green); color:#052e16; padding:9px 18px; border-radius:20px; font-weight:800; font-size:13px; opacity:0; transition:all 0.3s; z-index:300; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); }
.empty-state .emoji { font-size:44px; margin-bottom:10px; }
.empty-state p { font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <div class="logo">🛒</div>
  <h1>공구 주문 정리</h1>
</header>
<div class="stats-bar">
  <div class="stat">👥 <span id="stat-people">0</span>명</div>
  <div class="stat">📦 총 <span id="stat-qty">0</span>개</div>
  <div class="stat">🗂 항목 <span id="stat-items">0</span>종</div>
</div>
<div class="main">
  <div class="input-section">
    <div class="tab-row">
      <button class="tab-btn active" id="tab-text" onclick="switchInput('text')">💬 직접 붙여넣기</button>
      <button class="tab-btn" id="tab-file" onclick="switchInput('file')">📂 TXT 파일</button>
    </div>
    <div id="pane-text">
      <textarea class="chat-input" id="chat-input" placeholder="카톡 대화 내용을 여기에 붙여넣으세요.

예시:
[아기천사4672] [오전 11:06] 서리태콩물1, 우뭇콩물1
[라이언1460] [오전 11:07] 버터쿠키1
[모모야1212] [오전 11:11] 한우너비아니2
한돈너비아니2"></textarea>
      <div class="input-hint">📋 여러 명의 메시지를 한 번에 붙여넣어도 됩니다.</div>
    </div>
    <div id="pane-file" style="display:none">
      <div class="file-upload-area" id="drop-zone">
        <input type="file" accept=".txt" id="file-input" onchange="handleFile(this.files[0])">
        <div class="file-upload-icon">📄</div>
        <div class="file-upload-text"><strong>카톡 대화 내보내기 TXT</strong>를 끌어다 놓거나 탭해서 선택</div>
      </div>
      <div class="input-hint">💡 카카오톡 PC → 채팅방 우상단 메뉴 → 대화 내보내기</div>
      <div id="file-status" style="display:none;margin-top:8px;font-size:13px;color:var(--kakao);font-weight:700;"></div>
    </div>
    <button class="parse-btn" id="parse-btn" onclick="parseOrders()">
      <span>🤖</span> AI로 주문 자동 정리
    </button>
  </div>
  <div class="orders-section">
    <div class="section-header">
      <div class="section-title">📋 주문 현황</div>
      <button class="clear-btn" onclick="clearAll()">전체 삭제</button>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" id="vtab-list" onclick="switchView('list')">📝 전체 목록</button>
      <button class="view-tab" id="vtab-item" onclick="switchView('item')">🗂 항목별</button>
      <button class="view-tab" id="vtab-name" onclick="switchView('name')">👤 닉네임별</button>
    </div>
    <div id="view-list"></div>
    <div id="view-item" style="display:none"></div>
    <div id="view-name" style="display:none"></div>
  </div>
</div>
<div class="bottom-summary">
  <div class="summary-left">총 <strong id="bottom-total">0</strong>개</div>
  <div style="display:flex;gap:8px;">
    <button class="export-btn" style="background:#1d6f42;color:#fff;" onclick="exportExcel()">📊 엑셀</button>
    <button class="export-btn" onclick="exportText()">📤 복사</button>
  </div>
</div>
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">AI 분석 중...</div>
  <div style="display:flex;gap:10px;margin-top:4px;">
    <div class="step-dot" id="step1">1회</div>
    <div class="step-dot" id="step2">2회</div>
    <div class="step-dot" id="step3">3회</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var orders = [];
var currentInput = 'text';
var currentView = 'list';
var fileContent = '';
var GEMINI_KEY = 'AIzaSyA6A61NTP-d2ozHiWu-C5N7bgd6sR6k4IM';

var SYSTEM_PROMPT = '너는 카카오톡 공동구매 오픈채팅방의 주문 메시지를 분석하는 전문가야.\n' +
'채팅 내용에서 주문 정보만 추출해줘.\n\n' +
'실제 카톡 내보내기 형식:\n' +
'[닉네임] [오전/오후 HH:MM] 메시지내용\n\n' +
'파싱 규칙:\n' +
'1. [닉네임] [시간] 으로 시작하는 줄이 주문자 메시지임\n' +
'2. 다음 줄에 [닉네임]이 없으면 같은 사람의 추가 주문임\n' +
'3. 항목: 메시지에서 숫자/쉼표 제외한 상품명\n' +
'4. 수량: 상품명 뒤 숫자. 없으면 1\n' +
'5. 쉼표로 나열하면 각각 별도 주문\n' +
'6. [닉네임][시간] 없는 줄은 공지/광고이므로 무시\n' +
'7. 날짜 구분선에서 날짜 추출 (YYYY-MM-DD), 없으면 빈값\n\n' +
'반드시 JSON만 반환해. 다른 말 하지 마.\n' +
'형식: {"orders": [{"name": "닉네임", "item": "항목", "qty": 숫자, "date": "YYYY-MM-DD"}]}';

function switchInput(tab) {
  currentInput = tab;
  document.getElementById('tab-text').classList.toggle('active', tab === 'text');
  document.getElementById('tab-file').classList.toggle('active', tab === 'file');
  document.getElementById('pane-text').style.display = tab === 'text' ? '' : 'none';
  document.getElementById('pane-file').style.display = tab === 'file' ? '' : 'none';
}

function switchView(v) {
  currentView = v;
  ['list','item','name'].forEach(function(x) {
    document.getElementById('vtab-'+x).classList.toggle('active', x === v);
    document.getElementById('view-'+x).style.display = x === v ? '' : 'none';
  });
  renderAll();
}

var dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file || !file.name.endsWith('.txt')) { showToast('TXT 파일만 올려주세요!', '#f87171'); return; }
  var reader = new FileReader();
  reader.onload = function(ev) {
    fileContent = ev.target.result;
    var status = document.getElementById('file-status');
    status.style.display = '';
    status.textContent = '✅ "' + file.name + '" 로드 완료 (' + fileContent.split('\n').length + '줄)';
    dropZone.style.borderColor = 'var(--green)';
  };
  reader.readAsText(file, 'UTF-8');
}

function callAI(text) {
  var prompt = SYSTEM_PROMPT + '\n\n다음 카톡 내용에서 주문 정보를 추출해줘:\n\n' + text.slice(0, 3000);
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + GEMINI_KEY;
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 4000 }
    })
  }).then(function(res) {
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
  }).then(function(data) {
    var raw = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
    if (!raw) throw new Error('응답 없음');
    var clean = raw.replace(/```json|```/g, '').trim();
    var startIdx = clean.indexOf('{');
    var endIdx = clean.lastIndexOf('}');
    if (startIdx !== -1 && endIdx !== -1) { clean = clean.slice(startIdx, endIdx + 1); }
    var parsed = JSON.parse(clean);
    if (!Array.isArray(parsed.orders)) throw new Error('형식 오류');
    return parsed;
  });
}

function mergeResults(results) {
  var valid = results.filter(function(r) { return r && Array.isArray(r.orders) && r.orders.length > 0; });
  if (!valid.length) return [];
  var keySet = {};
  valid.forEach(function(r) {
    r.orders.forEach(function(o) {
      var k = o.name + '||' + (o.item || '') + '||' + (o.date || '');
      keySet[k] = true;
    });
  });
  return Object.keys(keySet).map(function(key) {
    var parts = key.split('||');
    var name = parts[0], item = parts[1], date = parts[2];
    var hits = valid.filter(function(r) {
      return r.orders.some(function(o) {
        return o.name === name && (o.item || '') === item && (o.date || '') === date;
      });
    });
    var qtys = hits.map(function(r) {
      return r.orders.find(function(o) {
        return o.name === name && (o.item || '') === item && (o.date || '') === date;
      }).qty;
    }).sort(function(a, b) { return a - b; });
    return { name: name, item: item, date: date, qty: qtys[Math.floor(qtys.length / 2)], confirmed: hits.length === results.length };
  });
}

function setStep(n) {
  for (var i = 1; i <= 3; i++) {
    document.getElementById('step' + i).className = 'step-dot' + (i < n ? ' done' : i === n ? ' active' : '');
  }
  document.getElementById('loading-text').textContent = n <= 3 ? 'AI 검증 중... (' + n + '/3회)' : '교차검증 중...';
}

function parseOrders() {
  var text = '';
  if (currentInput === 'text') {
    text = document.getElementById('chat-input').value.trim();
    if (!text) { showToast('메시지를 입력해주세요!', '#f87171'); return; }
  } else {
    if (!fileContent) { showToast('파일을 먼저 올려주세요!', '#f87171'); return; }
    text = fileContent;
  }

  document.getElementById('loading').classList.add('show');
  document.getElementById('parse-btn').disabled = true;
  for (var i = 1; i <= 3; i++) document.getElementById('step' + i).className = 'step-dot';

  var results = [];

  function runRound(round) {
    if (round > 3) {
      setStep(4);
      setTimeout(function() {
        var final = mergeResults(results);
        if (final.length > 0) {
          final.forEach(function(o) {
            var ex = orders.find(function(e) { return e.name === o.name && e.item === o.item && e.date === o.date; });
            if (ex) { ex.qty += o.qty; ex.confirmed = o.confirmed; }
            else orders.push({ name: o.name, item: o.item || '', date: o.date || '', qty: o.qty, confirmed: o.confirmed });
          });
          renderAll();
          document.getElementById('chat-input').value = '';
          fileContent = '';
          document.getElementById('file-status').style.display = 'none';
          dropZone.style.borderColor = '';
          var bad = final.filter(function(o) { return !o.confirmed; }).length;
          showToast(bad > 0 ? '✅ ' + final.length + '건 완료 (⚠️ ' + bad + '건 재확인)' : '✅ 3회 검증 완료! ' + final.length + '건', bad > 0 ? '#f59e0b' : '#4ade80');
        } else {
          showToast('주문 내역을 찾을 수 없어요', '#f87171');
        }
        document.getElementById('loading').classList.remove('show');
        document.getElementById('parse-btn').disabled = false;
      }, 400);
      return;
    }
    setStep(round);
    callAI(text).then(function(parsed) {
      results.push(parsed);
    }).catch(function(e) {
      console.warn(round + '회 실패', e);
      results.push({ orders: [] });
    }).then(function() {
      setTimeout(function() { runRound(round + 1); }, 300);
    });
  }

  runRound(1);
}

function renderAll() {
  renderList();
  renderByItem();
  renderByName();
  updateStats();
}

function renderList() {
  var el = document.getElementById('view-list');
  if (!orders.length) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">👆</div><p>카톡 메시지를 붙여넣거나<br>TXT 파일을 올리고 버튼을 눌러보세요!</p></div>';
    return;
  }
  el.innerHTML = orders.map(function(o, i) {
    var badge = o.confirmed === false ? '<span class="row-badge badge-warn">⚠</span>' : o.confirmed === true ? '<span class="row-badge badge-ok">✓</span>' : '';
    return '<div class="order-row ' + (o.confirmed === false ? 'warn' : '') + '">' +
      '<span class="row-num">' + (i+1) + '</span>' +
      '<div class="row-body"><span class="row-name">' + o.name + '</span>' +
      '<span class="row-item"> · ' + (o.item || '(항목없음)') + ' · ' + o.qty + '개' + (o.date ? ' · ' + o.date : '') + '</span></div>' +
      badge +
      '<button class="row-del" onclick="deleteOrder(' + i + ')">✕</button>' +
      '</div>';
  }).join('');
}

function renderByItem() {
  var el = document.getElementById('view-item');
  if (!orders.length) { el.innerHTML = ''; return; }
  var map = {};
  orders.forEach(function(o) {
    var k = o.item || '(항목없음)';
    if (!map[k]) map[k] = [];
    map[k].push(o);
  });
  el.innerHTML = Object.keys(map).map(function(item) {
    var list = map[item];
    var total = list.reduce(function(s, o) { return s + o.qty; }, 0);
    var rows = list.map(function(o) { return '<div class="group-row"><strong>' + o.name + '</strong> · ' + o.qty + '개' + (o.date ? ' · ' + o.date : '') + '</div>'; }).join('');
    return '<div class="group-card"><div class="group-header"><span class="group-title">🗂 ' + item + '</span><span class="group-count">총 ' + total + '개 · ' + list.length + '명</span></div><div class="group-rows">' + rows + '</div></div>';
  }).join('');
}

function renderByName() {
  var el = document.getElementById('view-name');
  if (!orders.length) { el.innerHTML = ''; return; }
  var map = {};
  orders.forEach(function(o) {
    if (!map[o.name]) map[o.name] = [];
    map[o.name].push(o);
  });
  el.innerHTML = Object.keys(map).map(function(name) {
    var list = map[name];
    var total = list.reduce(function(s, o) { return s + o.qty; }, 0);
    var rows = list.map(function(o) { return '<div class="group-row"><strong>' + (o.item || '(항목없음)') + '</strong> · ' + o.qty + '개' + (o.date ? ' · ' + o.date : '') + '</div>'; }).join('');
    return '<div class="group-card"><div class="group-header"><span class="group-title">👤 ' + name + '</span><span class="group-count">총 ' + total + '개</span></div><div class="group-rows">' + rows + '</div></div>';
  }).join('');
}

function updateStats() {
  var totalQty = orders.reduce(function(s, o) { return s + o.qty; }, 0);
  var names = {};
  var items = {};
  orders.forEach(function(o) { names[o.name] = true; items[o.item || '(항목없음)'] = true; });
  document.getElementById('stat-people').textContent = Object.keys(names).length;
  document.getElementById('stat-qty').textContent = totalQty;
  document.getElementById('stat-items').textContent = Object.keys(items).length;
  document.getElementById('bottom-total').textContent = totalQty;
}

function deleteOrder(idx) { orders.splice(idx, 1); renderAll(); showToast('삭제했어요'); }

function clearAll() {
  if (!orders.length) return;
  if (!confirm('주문 내역을 전부 삭제할까요?')) return;
  orders = []; renderAll();
}

function exportExcel() {
  if (!orders.length) { showToast('주문 내역이 없어요', '#f87171'); return; }
  var today = new Date();
  var dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var rows = orders.map(function(o, i) {
    return { '번호': i+1, '주문날짜': o.date || '', '고객명': o.name, '항목': o.item || '', '수량': o.qty, '검증': o.confirmed === true ? '✓' : o.confirmed === false ? '⚠' : '-' };
  });
  var total = orders.reduce(function(s, o) { return s + o.qty; }, 0);
  rows.push({ '번호': '', '주문날짜': '', '고객명': '합계', '항목': '', '수량': total, '검증': Object.keys(orders.reduce(function(m, o) { m[o.name] = 1; return m; }, {})).length + '명' });
  var ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:14},{wch:18},{wch:24},{wch:8},{wch:8}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '주문현황');
  XLSX.writeFile(wb, '공구주문_' + dateStr + '.xlsx');
  showToast('📊 엑셀 저장됐어요!');
}

function exportText() {
  if (!orders.length) { showToast('주문 내역이 없어요', '#f87171'); return; }
  var total = orders.reduce(function(s, o) { return s + o.qty; }, 0);
  var text = '📋 공동구매 주문 현황\n';
  text += '──────────────────────────────\n';
  orders.forEach(function(o, i) { text += (i+1) + '. ' + (o.date || '-') + ' / ' + o.name + ' / ' + (o.item || '-') + ' / ' + o.qty + '개\n'; });
  text += '──────────────────────────────\n';
  var nameCount = Object.keys(orders.reduce(function(m, o) { m[o.name] = 1; return m; }, {})).length;
  text += '👥 ' + nameCount + '명 / 📦 ' + total + '개';
  navigator.clipboard.writeText(text).then(function() { showToast('📋 복사됐어요!'); }).catch(function() { alert(text); });
}

function showToast(msg, color) {
  color = color || '#4ade80';
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color;
  t.style.color = color === '#4ade80' ? '#052e16' : '#fff';
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

renderAll();
</script>
</body>
</html>
